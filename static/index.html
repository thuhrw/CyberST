<!doctype html><meta charset=utf-8><title>MITM Lab</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:900px;margin:30px auto}section{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}input,select,button{padding:10px;margin:5px;background:#334155;color:white;border:1px solid #64748b;border-radius:6px}button{background:#06b6d4;color:#042f2e;font-weight:bold}.log{padding:9px;border-bottom:1px solid #475569}.Alice{color:#86efac}.Bob{color:#fda4af}.Evil{color:#fcd34d}.network{display:flex;align-items:center;justify-content:space-around;margin:25px 0;position:relative}.node{width:120px;text-align:center;padding:18px 8px;border-radius:14px;background:#334155;border:2px solid #64748b;transition:.35s}.node.active{border-color:#22d3ee;box-shadow:0 0 24px #22d3ee;transform:scale(1.08)}.node .icon{font-size:35px}.link{height:4px;flex:1;background:#64748b;position:relative;margin:0 10px}.packet{position:absolute;width:14px;height:14px;border-radius:50%;background:#facc15;top:50%;transform:translate(-50%,-50%);z-index:3;opacity:0}.packet.animate{opacity:1}.packet.ae{animation:toEvil .8s ease-in-out}.packet.eb{animation:toBob .8s ease-in-out}.packet.full{animation:toOther .9s ease-in-out}.packet.ba{animation:toAlice .9s ease-in-out}@keyframes toEvil{0%{left:16%;opacity:1}85%{left:50%;opacity:1}100%{left:50%;opacity:0}}@keyframes toBob{0%{left:50%;opacity:1}85%{left:84%;opacity:1}100%{left:84%;opacity:0}}@keyframes toOther{0%{left:16%;opacity:1}85%{left:84%;opacity:1}100%{left:84%;opacity:0}}@keyframes toAlice{0%{left:84%;opacity:1}85%{left:16%;opacity:1}100%{left:16%;opacity:0}}</style><h1>🔐 Alice · Bob · Evil MITM Lab</h1><section><input id=m value='Meet at 10:00'><select id=a><option value=none>Normal communication</option><option value=key_replace>Key replacement (eavesdropping)</option><option value=tamper>Message tampering</option></select><label><input type=checkbox id=d>Enable defense</label><button onclick=go()>Run experiment</button><button id=next onclick=step() disabled>Next step</button></section><section><div class=network><div id=alice class=node><div class=icon>👩‍💻</div><b>Alice</b></div><div id=link1 class=link></div><div id=evil class=node><div class=icon>🕵️</div><b>Evil</b></div><div id=link2 class=link></div><i id=packet class=packet></i><div id=bob class=node><div class=icon>👨‍💻</div><b>Bob</b></div></div><div id=o>Select a scenario</div></section><script>let x,i=0;async function go(){x=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m.value,attack:a.value,defense:d.checked})}).then(r=>r.json());i=0;next.disabled=!x.logs.length;render()}function step(){if(i<x.logs.length)i++;render()}function render(){document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));document.querySelectorAll('.link').forEach(n=>n.classList.remove('animate'));packet.className='packet';if(i>0){let actor=x.logs[i-1].actor;if(actor.includes('Alice'))alice.classList.add('active');if(actor.includes('Evil'))evil.classList.add('active');if(actor.includes('Bob'))bob.classList.add('active');let action=x.logs[i-1].action;if(actor==='Alice' && action.includes('Send')) packet.classList.add('animate', action.includes('public key') ? 'full' : 'ae');if(actor==='Bob' && action.includes('Send')) packet.classList.add('animate','ba');if(actor==='Evil' && action.includes('Replace')) packet.classList.add('animate','full');if(actor==='Evil' && (action.includes('Forward') || action.includes('Tamper'))) packet.classList.add('animate','eb');}let shown=x.logs.slice(0,i);o.innerHTML='<h2>'+x.message+'</h2><p>Step '+i+' / '+x.logs.length+'</p>'+shown.map(v=>`<div class="log ${v.actor}"><b>${v.actor}</b> · ${v.action}: ${v.detail}</div>`).join('');if(i===x.logs.length&&x.received)o.innerHTML+='<p><b>Received:</b> '+x.received+'　<b>Integrity:</b> '+(x.integrity===undefined?'—':x.integrity?'✅':'❌')+'</p>'}</script>
