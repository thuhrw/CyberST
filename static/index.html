<!doctype html><meta charset=utf-8><title>MITM实验器</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:900px;margin:30px auto}section{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}input,select,button{padding:10px;margin:5px;background:#334155;color:white;border:1px solid #64748b;border-radius:6px}button{background:#06b6d4;color:#042f2e;font-weight:bold}.log{padding:9px;border-bottom:1px solid #475569}.Alice{color:#86efac}.Bob{color:#fda4af}.Evil{color:#fcd34d}</style><h1>🔐 Alice · Bob · Evil MITM Lab</h1><section><input id=m value='Meet at 10:00'><select id=a><option value=none>Normal communication</option><option value=key_replace>Key replacement (eavesdropping)</option><option value=tamper>Message tampering</option></select><label><input type=checkbox id=d>Enable defense</label><button onclick=go()>Run experiment</button></section><section id=o>Select a scenario</section><script>async function go(){let x=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m.value,attack:a.value,defense:d.checked})}).then(r=>r.json());o.innerHTML='<h2>'+x.message+'</h2><p>Received:<b>'+(x.received||'—')+'</b>　Integrity:'+(x.integrity===undefined?'—':x.integrity?'✅':'❌')+'</p>'+x.logs.map(v=>`<div class='log ${v.actor}'><b>${v.actor}</b> · ${v.action}：${v.detail}</div>`).join('')}</script>
