<!doctype html><meta charset=utf-8><title>MITM Lab</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:1400px;width:calc(100% - 40px);margin:30px auto}section{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}input,select,button{padding:10px;margin:5px;background:#334155;color:white;border:1px solid #64748b;border-radius:6px}button{background:#06b6d4;color:#042f2e;font-weight:bold}.log{padding:12px 14px;margin:8px 0;border-radius:9px;background:#273449;border-left:4px solid #64748b;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}.log b{margin-right:8px}.Alice{border-left-color:#4ade80}.Bob{border-left-color:#fb7185}.Evil{border-left-color:#facc15}.Alice{color:#86efac}.Bob{color:#fda4af}.Evil{color:#fcd34d}.network{--node-center:60px;display:grid;grid-template-columns:120px minmax(0,1fr) 120px minmax(0,1fr) 120px;gap:20px;align-items:center;margin:25px 0;position:relative}.network #alice{grid-column:1}.network #link1{grid-column:2}.network #evil{grid-column:3}.network #link2{grid-column:4}.network #bob{grid-column:5}.node{width:120px;box-sizing:border-box;text-align:center;padding:18px 8px;border-radius:14px;background:#334155;border:2px solid #64748b;transition:.35s}.node.active{border-color:#22d3ee;box-shadow:0 0 24px #22d3ee;transform:scale(1.08)}.node .icon{font-size:35px}.link{height:4px;width:100%;background:#64748b;position:relative}.packet{position:absolute;width:14px;height:14px;border-radius:50%;background:#facc15;top:50%;transform:translate(-50%,-50%);z-index:3;opacity:0}.packet.animate{opacity:1}.packet.ae{animation:toEvil .8s ease-in-out}.packet.eb{animation:toBob .8s ease-in-out}.packet.full{animation:toOther .9s ease-in-out}.packet.ba{animation:toAlice .9s ease-in-out}.packet.be{animation:toEvilReverse .8s ease-in-out}.packet.ea{animation:toAliceFromEvil .8s ease-in-out}@keyframes toEvil{0%{left:var(--node-center);opacity:1}85%{left:50%;opacity:1}100%{left:50%;opacity:0}}@keyframes toBob{0%{left:50%;opacity:1}85%{left:calc(100% - var(--node-center));opacity:1}100%{left:calc(100% - var(--node-center));opacity:0}}@keyframes toOther{0%{left:var(--node-center);opacity:1}85%{left:calc(100% - var(--node-center));opacity:1}100%{left:calc(100% - var(--node-center));opacity:0}}@keyframes toAlice{0%{left:calc(100% - var(--node-center));opacity:1}85%{left:var(--node-center);opacity:1}100%{left:var(--node-center);opacity:0}}@keyframes toEvilReverse{0%{left:calc(100% - var(--node-center));opacity:1}85%{left:50%;opacity:1}100%{left:50%;opacity:0}}@keyframes toAliceFromEvil{0%{left:50%;opacity:1}85%{left:var(--node-center);opacity:1}100%{left:var(--node-center);opacity:0}}@media(max-width:700px){.network{--node-center:40px;grid-template-columns:80px minmax(0,1fr) 80px minmax(0,1fr) 80px;gap:8px}.node{width:80px;padding:12px 4px}.node .icon{font-size:26px}}</style><h1>🔐 Alice · Bob · Evil MITM Lab</h1><section><input id=m value='Meet at 10:00'><select id=a><option value=none>Normal communication</option><option value=key_replace>Key replacement (eavesdropping)</option><option value=tamper>Message tampering</option></select><label><input type=checkbox id=d>Enable defense</label><button onclick=go()>Run experiment</button><button id=next onclick=step() disabled>Next step</button></section><section><div class=network><div id=alice class=node><div class=icon>👩‍💻</div><b>Alice</b></div><div id=link1 class=link></div><div id=evil class=node><div class=icon>🕵️</div><b>Evil</b></div><div id=link2 class=link></div><i id=packet class=packet></i><div id=bob class=node><div class=icon>👨‍💻</div><b>Bob</b></div></div><div id=o>Select a scenario</div></section><script>let x,i=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));packet.addEventListener('animationend',()=>{packet.style.opacity='0'});async function go(){x=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m.value,attack:a.value,defense:d.checked})}).then(r=>r.json());i=0;next.disabled=!x.logs.length;render()}function step(){if(i<x.logs.length)i++;render()}function render(){document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));document.querySelectorAll('.link').forEach(n=>n.classList.remove('animate'));packet.className='packet';packet.style.opacity='0';if(i>0){let actor=x.logs[i-1].actor;if(actor.includes('Alice'))alice.classList.add('active');if(actor.includes('Evil'))evil.classList.add('active');if(actor.includes('Bob'))bob.classList.add('active');let action=x.logs[i-1].action;if(actor==='Alice' && action.includes('Send')) packet.classList.add('animate','ae');if(actor==='Bob' && action.includes('Send')) packet.classList.add('animate','be');if(actor==='Evil' && action.includes('Replace')) packet.classList.add('animate', action.includes('Bob key') ? 'ea' : 'eb');if(actor==='Evil' && action.includes('Forward')) packet.classList.add('animate',x.logs[i-1].detail.includes('Alice')?'ea':'eb');if(actor==='Evil' && action.includes('Tamper')) packet.classList.add('animate','eb');}let shown=x.logs.slice(0,i);o.innerHTML='<h2>'+esc(x.message)+'</h2><p>Step '+i+' / '+x.logs.length+'</p>'+shown.map(v=>`<div class="log ${esc(v.actor)}"><b>${esc(v.actor)}</b> · ${esc(v.action)}: ${esc(v.detail)}</div>`).join('');if(i===x.logs.length&&x.received)o.innerHTML+='<p><b>Received:</b> '+esc(x.received)+'　<b>Integrity:</b> '+(x.integrity===undefined?'—':x.integrity?'✅':'❌')+'</p>'}</script>
