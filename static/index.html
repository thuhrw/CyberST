<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITM Lab · 通信攻防实验器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07131a;
      --panel: rgba(10, 28, 38, .82);
      --panel-strong: #102631;
      --line: rgba(116, 188, 209, .2);
      --text: #d9edf2;
      --muted: #8caab5;
      --cyan: #58d9ff;
      --cyan-deep: #8be8ff;
      --green: #72f7a0;
      --yellow: #ffe071;
      --red: #ff8498;
      --purple: #aa96ef;
      --shadow: 0 22px 70px rgba(0, 0, 0, .38);
      --font-ui: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      font-family: var(--font-ui);
      background:
        radial-gradient(circle at 8% 0%, rgba(39, 137, 165, .2), transparent 32rem),
        radial-gradient(circle at 92% 10%, rgba(105, 77, 165, .16), transparent 30rem),
        linear-gradient(rgba(3, 12, 18, .76), rgba(3, 12, 18, .86)),
        var(--bg);
    }

    .shell { width: min(1500px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 54px; }
    .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 8px 0 8px; font-family: var(--font-ui); font-size: clamp(28px, 4vw, 46px); letter-spacing: -.04em; line-height: 1.05; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }

    .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .controls { padding: 20px; margin-bottom: 0; }
    .control-grid { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(110px, .8fr) auto; gap: 9px; align-items: end; }
    .message-field { grid-column: 1 / -1; }
    .control-actions { grid-column: 3; display: flex; justify-content: flex-end; gap: 9px; }
    .field { display: grid; gap: 7px; }
    .field label, .toggle-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    input[type="text"], select { width: 100%; min-height: 44px; padding: 0 13px; border: 1px solid rgba(116, 188, 209, .24); border-radius: 11px; outline: none; color: var(--text); background: rgba(4, 17, 24, .72); font: inherit; font-family: var(--font-ui); transition: .2s; }
    input[type="text"]:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(85, 217, 255, .13); }
    .toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 13px; border: 1px solid rgba(116, 188, 209, .2); border-radius: 11px; background: rgba(4, 17, 24, .64); white-space: nowrap; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--green); }
    .toggle input:checked + span { color: var(--green); }
    button { min-height: 44px; padding: 0 17px; border: 0; border-radius: 11px; color: #03141c; background: linear-gradient(135deg, #58d9ff, #1599bc); font: inherit; font-family: var(--font-ui); font-weight: 800; cursor: pointer; box-shadow: 0 8px 24px rgba(34, 211, 238, .16); transition: transform .18s, filter .18s, opacity .18s; }
    button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .42; box-shadow: none; }
    #next { color: var(--text); background: rgba(16, 42, 54, .86); box-shadow: none; }

    .grid { display: grid; grid-template-columns: minmax(620px, .8fr) minmax(480px, 1.2fr); gap: 20px; align-items: stretch; }
    .left-stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
    .topology, .events { min-width: 0; padding: 22px; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid rgba(148, 163, 184, .2); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 12px currentColor; }
    .status.ready .status-dot { background: var(--cyan); }
    .status.success .status-dot { background: var(--green); }
    .status.blocked .status-dot { background: var(--red); }

    .network { --node-center: 55px; display: grid; grid-template-columns: 110px minmax(35px, 1fr) 110px minmax(35px, 1fr) 110px; gap: 12px; align-items: center; min-height: 270px; padding: 25px 10px; border: 1px solid rgba(116, 188, 209, .2); border-radius: 17px; background: linear-gradient(180deg, rgba(14, 48, 62, .72), rgba(6, 26, 36, .78)); position: relative; overflow: hidden; }
    .network::before { content: ""; position: absolute; inset: 50% 8%; height: 1px; background: linear-gradient(90deg, transparent, rgba(85, 217, 255, .18), transparent); }
    .node { position: relative; z-index: 2; width: 110px; padding: 15px 7px 13px; border: 1px solid rgba(116, 188, 209, .28); border-radius: 16px; text-align: center; color: var(--text); background: linear-gradient(145deg, rgba(24, 61, 74, .88), rgba(8, 31, 42, .9)); transition: .35s; }
    .node::after { content: attr(data-role); display: block; margin-top: 6px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .node.active { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(85, 217, 255, .25), 0 0 30px rgba(85, 217, 255, .2); transform: translateY(-3px); }
    .node .icon { margin-bottom: 4px; font-size: 34px; filter: saturate(.9); }
    #alice { grid-column: 1; } #link1 { grid-column: 2; } #evil { grid-column: 3; } #link2 { grid-column: 4; } #bob { grid-column: 5; }
    .link { position: relative; z-index: 1; height: 2px; width: 100%; background: linear-gradient(90deg, rgba(22, 133, 167, .2), rgba(55, 91, 116, .45), rgba(22, 133, 167, .2)); }
    .link.animate { background: linear-gradient(90deg, var(--cyan), rgba(148, 163, 184, .45), var(--cyan)); box-shadow: 0 0 14px rgba(85, 217, 255, .65); }
    .packet { position: absolute; z-index: 4; width: 15px; height: 15px; border: 2px solid #fff1a6; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 7px rgba(255, 224, 113, .7), 0 0 18px rgba(255, 224, 113, .5); top: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
    .packet.animate { opacity: 1; }
    .packet.ae { animation: toEvil .8s ease-in-out; } .packet.eb { animation: toBob .8s ease-in-out; } .packet.full { animation: toOther .9s ease-in-out; } .packet.ba { animation: toAlice .9s ease-in-out; } .packet.be { animation: toEvilReverse .8s ease-in-out; } .packet.ea { animation: toAliceFromEvil .8s ease-in-out; }
    @keyframes toEvil { 0% { left: var(--node-center); opacity: 1 } 85% { left: 50%; opacity: 1 } 100% { left: 50%; opacity: 0 } }
    @keyframes toBob { 0% { left: 50%; opacity: 1 } 85% { left: calc(100% - var(--node-center)); opacity: 1 } 100% { left: calc(100% - var(--node-center)); opacity: 0 } }
    @keyframes toOther { 0% { left: var(--node-center); opacity: 1 } 85% { left: calc(100% - var(--node-center)); opacity: 1 } 100% { left: calc(100% - var(--node-center)); opacity: 0 } }
    @keyframes toAlice { 0% { left: calc(100% - var(--node-center)); opacity: 1 } 85% { left: var(--node-center); opacity: 1 } 100% { left: var(--node-center); opacity: 0 } }
    @keyframes toEvilReverse { 0% { left: calc(100% - var(--node-center)); opacity: 1 } 85% { left: 50%; opacity: 1 } 100% { left: 50%; opacity: 0 } }
    @keyframes toAliceFromEvil { 0% { left: 50%; opacity: 1 } 85% { left: var(--node-center); opacity: 1 } 100% { left: var(--node-center); opacity: 0 } }

    .events { display: flex; min-height: 100%; flex-direction: column; }
    .event-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .event-head h2 { margin: 0; font-size: 17px; }
    #output { flex: 1; min-height: 390px; max-height: 570px; overflow: auto; padding-right: 5px; }
    #output::-webkit-scrollbar { width: 7px; } #output::-webkit-scrollbar-thumb { border-radius: 10px; background: rgba(148, 163, 184, .25); }
    .session-grid { display: grid; grid-template-columns: repeat(var(--session-count, 2), minmax(0, 1fr)); gap: 12px; align-items: start; }
    .session-column { min-width: 0; padding: 10px; border: 1px solid rgba(116, 188, 209, .18); border-radius: 12px; background: rgba(7, 25, 34, .58); }
    .session-column h3 { margin: 0 0 4px; color: var(--cyan-deep); font-size: 13px; }
    .session-id { margin-bottom: 9px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; overflow-wrap: anywhere; }
    .session-column .empty-session { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .empty { display: grid; place-items: center; min-height: 300px; padding: 35px; border: 1px dashed rgba(116, 188, 209, .28); border-radius: 15px; color: var(--muted); background: rgba(4, 17, 24, .34); text-align: center; line-height: 1.7; }
    .step-count { color: var(--muted); font-size: 12px; }
    .log { position: relative; margin: 8px 0; padding: 11px 12px 11px 40px; border: 1px solid rgba(116, 188, 209, .18); border-left: 3px solid rgba(116, 188, 209, .42); border-radius: 10px; color: var(--text); background: rgba(9, 32, 43, .72); line-height: 1.55; overflow-wrap: anywhere; word-break: break-word; font-size: 13px; }
    .log::before { content: attr(data-step); position: absolute; left: 10px; top: 12px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .log b { margin-right: 7px; font-size: 12px; }
    .log.Alice { border-left-color: var(--green); } .log.Alice b { color: var(--green); }
    .log.Bob { border-left-color: var(--red); } .log.Bob b { color: #fda4af; }
    .log.Evil { border-left-color: var(--yellow); } .log.Evil b { color: var(--yellow); }
    .result { margin-top: 14px; padding: 14px; border: 1px solid rgba(88, 217, 255, .24); border-radius: 13px; background: rgba(8, 34, 46, .78); line-height: 1.65; }
    .result strong { color: var(--cyan); }
    .result.blocked { border-color: rgba(251, 113, 133, .28); background: rgba(127, 29, 49, .16); }
    .result.blocked strong { color: #fda4af; }

    @media (max-width: 1200px) { .control-grid { grid-template-columns: minmax(210px, 1.2fr) minmax(145px, .8fr) auto; } .grid { grid-template-columns: 1fr; } #output { max-height: none; } }
    @media (max-width: 800px) { .session-grid { grid-template-columns: 1fr; } }
    @media (max-width: 700px) { .shell { width: min(100% - 24px, 620px); padding-top: 22px; } .hero { align-items: start; } .control-grid { grid-template-columns: 1fr; } .control-actions { grid-column: 1; } .network { --node-center: 40px; grid-template-columns: 80px minmax(0, 1fr) 80px minmax(0, 1fr) 80px; gap: 7px; min-height: 230px; padding: 18px 4px; } .node { width: 80px; padding: 12px 3px; border-radius: 13px; font-size: 12px; } .node .icon { font-size: 25px; } .node::after { font-size: 8px; } .topology, .events { padding: 16px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">CyberST</div>
        <h1>中间人攻防实验器</h1>
      </div>
    </header>

    <div class="grid">
      <div class="left-stack">
        <section class="panel controls">
          <div class="control-grid">
            <div class="field message-field">
              <label for="message">消息内容</label>
              <input id="message" type="text" value="Meet at 10:00" autocomplete="off">
            </div>
            <div class="field">
              <label for="attack">实验场景</label>
              <select id="attack">
                <option value="none">正常通信</option>
                <option value="key_replace">密钥替换 / 窃听</option>
                <option value="tamper">消息篡改</option>
                <option value="replay">重放攻击</option>
              </select>
            </div>
            <label class="toggle" for="defense"><input id="defense" type="checkbox"><span>启用防御措施</span></label>
            <div class="control-actions">
              <button id="run" type="button">运行实验</button>
              <button id="next" type="button" disabled>下一步</button>
            </div>
          </div>
        </section>

        <section class="panel topology">
          <div class="panel-heading">
            <div><h2>通信拓扑</h2></div>
            <div id="status" class="status"><i class="status-dot"></i><span>等待实验</span></div>
          </div>
          <div class="network" id="network">
            <div id="alice" class="node" data-role="发送方"><div class="icon">👩‍💻</div><b>Alice</b></div>
            <div id="link1" class="link"></div>
            <div id="evil" class="node" data-role="攻击者"><div class="icon">🕵️</div><b>Evil</b></div>
            <div id="link2" class="link"></div>
            <div id="bob" class="node" data-role="接收方"><div class="icon">👨‍💻</div><b>Bob</b></div>
            <i id="packet" class="packet" aria-hidden="true"></i>
          </div>
        </section>
      </div>

      <section class="panel events">
        <div class="event-head"><div><h2>事件日志</h2><div id="step-count" class="step-count">运行实验后可逐步查看</div></div></div>
        <div id="output"><div class="empty">选择一个场景并运行实验<br>然后点击“下一步”观察每个通信动作</div></div>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const refs = { message: $('message'), attack: $('attack'), defense: $('defense'), run: $('run'), next: $('next'), output: $('output'), stepCount: $('step-count'), status: $('status'), packet: $('packet'), alice: $('alice'), evil: $('evil'), bob: $('bob'), links: document.querySelectorAll('.link') };
    let experiment = null;
    let currentStep = 0;
    let running = false;
    let requestController = null;

    refs.packet.addEventListener('animationend', () => { refs.packet.style.opacity = '0'; });
    refs.run.addEventListener('click', runExperiment);
    refs.next.addEventListener('click', nextStep);

    async function runExperiment() {
      if (running) { stopExperiment(); return; }
      running = true;
      requestController = new AbortController();
      refs.run.textContent = '停止实验';
      refs.message.disabled = true;
      refs.attack.disabled = true;
      refs.defense.disabled = true;
      refs.next.disabled = true;
      refs.status.className = 'status ready';
      refs.status.querySelector('span').textContent = '正在加载实验…';
      try {
        const response = await fetch('/api/simulate', { method: 'POST', headers: {'Content-Type': 'application/json'}, signal: requestController.signal, body: JSON.stringify({ message: refs.message.value, attack: refs.attack.value, defense: refs.defense.checked }) });
        if (!response.ok) throw new Error('请求状态 ' + response.status);
        experiment = await response.json();
        currentStep = 0;
        refs.next.disabled = !experiment.logs.length;
        render();
      } catch (error) {
        if (error.name === 'AbortError') return;
        refs.output.innerHTML = '<div class="empty">无法连接后端服务：' + esc(error.message) + '</div>';
        refs.stepCount.textContent = '请求失败';
        refs.status.className = 'status blocked';
        refs.status.querySelector('span').textContent = '连接失败';
      }
    }

    function stopExperiment() {
      if (requestController) requestController.abort();
      requestController = null;
      running = false;
      experiment = null;
      currentStep = 0;
      refs.run.textContent = '运行实验';
      refs.message.disabled = false;
      refs.attack.disabled = false;
      refs.defense.disabled = false;
      refs.next.disabled = true;
      refs.status.className = 'status';
      refs.status.querySelector('span').textContent = '等待实验';
      refs.stepCount.textContent = '运行实验后可逐步查看';
      refs.output.innerHTML = '<div class="empty">选择一个场景并运行实验<br>然后点击“下一步”观察每个通信动作</div>';
      animateFor(null);
    }

    function finishExperiment() {
      requestController = null;
      running = false;
      refs.run.textContent = '运行实验';
      refs.message.disabled = false;
      refs.attack.disabled = false;
      refs.defense.disabled = false;
      refs.next.disabled = true;
    }

    function nextStep() { if (experiment && currentStep < experiment.logs.length) { currentStep++; render(); } }

    function animateFor(log) {
      refs.packet.className = 'packet';
      refs.packet.style.opacity = '0';
      refs.links.forEach(link => link.classList.remove('animate'));
      if (!log) return;
      const actor = log.actor || '';
      if (actor.includes('Alice')) refs.alice.classList.add('active');
      if (actor.includes('Evil')) refs.evil.classList.add('active');
      if (actor.includes('Bob')) refs.bob.classList.add('active');
      const kind = log.kind || '';
      if (actor === 'Alice' && (kind === 'send_session_key' || kind === 'send_message')) { refs.packet.classList.add('animate', 'ae'); refs.links[0].classList.add('animate'); }
      if (actor === 'Bob' && kind === 'send_session_key') { refs.packet.classList.add('animate', 'be'); refs.links[1].classList.add('animate'); }
      if (actor === 'Evil' && kind === 'replace_alice_session_key') { refs.packet.classList.add('animate', 'eb'); refs.links[1].classList.add('animate'); }
      if (actor === 'Evil' && kind === 'replace_bob_session_key') { refs.packet.classList.add('animate', 'ea'); refs.links[0].classList.add('animate'); }
      if (actor === 'Evil' && (kind === 'forward_alice_key' || kind === 'observe_alice_key')) { refs.packet.classList.add('animate', 'eb'); refs.links[1].classList.add('animate'); }
      if (actor === 'Evil' && (kind === 'forward_bob_key' || kind === 'observe_bob_key')) { refs.packet.classList.add('animate', 'ea'); refs.links[0].classList.add('animate'); }
      if (actor === 'Evil' && (kind === 'forward_message' || kind === 'replay_message' || kind === 'decrypt_forward_message' || kind === 'tamper_message')) { refs.packet.classList.add('animate', 'eb'); refs.links[1].classList.add('animate'); }
    }

    function render() {
      document.querySelectorAll('.node').forEach(node => node.classList.remove('active'));
      const shown = experiment ? experiment.logs.slice(0, currentStep) : [];
      animateFor(experiment && currentStep ? experiment.logs[currentStep - 1] : null);
      refs.stepCount.textContent = experiment ? `步骤 ${currentStep} / ${experiment.logs.length}` : '运行实验后可逐步查看';
      if (!experiment || !shown.length) { refs.output.innerHTML = '<div class="empty">选择一个场景并运行实验<br>然后点击“下一步”观察每个通信动作</div>'; return; }
      const allSessions = experiment.defense ? (experiment.sessions || []) : [{ session_id: 'all', label: '通信过程' }];
      const sessions = experiment.defense
        ? allSessions.filter(session => shown.some(log => log.session_id === session.session_id))
        : allSessions;
      const columns = sessions.map(session => {
        const sessionLogs = session.session_id === 'all' ? shown : shown.filter(log => log.session_id === session.session_id);
        const content = sessionLogs.length ? sessionLogs.map((log, sessionIndex) => {
          const globalIndex = experiment.logs.indexOf(log) + 1;
          const detailSeparator = ['observe_alice_key', 'observe_bob_key', 'forward_alice_key', 'forward_bob_key', 'forward_message', 'session_ready'].includes(log.kind) ? '，' : '<br>';
          const detail = esc(log.detail);
          const detailMarkup = detail ? detailSeparator + detail : '';
          return `<div class="log ${esc(log.actor)}" data-step="${sessionIndex + 1}" data-global-step="${globalIndex}"><b>${esc(log.actor)}</b> · ${esc(log.action)}${detailMarkup}</div>`;
        }).join('') : '';
        return `<section class="session-column"><h3>${esc(session.label)}</h3>${content}</section>`;
      }).join('');
      const logs = `<div class="session-grid" style="--session-count:${Math.max(sessions.length, 1)}">${columns}</div>`;
      let result = '';
      if (currentStep === experiment.logs.length) {
        finishExperiment();
        const blocked = experiment.received === '[Rejected]' || experiment.received === '[Replay rejected]' || experiment.success === false;
        const integrity = !experiment.defense ? '未启用' : experiment.integrity === undefined ? '未提供' : experiment.integrity ? '通过' : '失败';
        const received = ({'[Rejected]':'已拒绝','[Replay rejected]':'重放已拒绝'})[experiment.received] || String(experiment.received || '未接收');
        result = `<div class="result ${blocked ? 'blocked' : ''}"><strong>${esc(experiment.message)}</strong><br>Bob 最终结果：${esc(received)}<br>完整性验证：${integrity}</div>`;
        refs.status.className = blocked ? 'status blocked' : 'status success';
        refs.status.querySelector('span').textContent = blocked ? '防御已触发' : '实验完成';
      } else {
        refs.status.className = 'status ready';
        refs.status.querySelector('span').textContent = '逐步播放中';
      }
      refs.output.innerHTML = logs + result;
      const target = currentStep === experiment.logs.length
        ? refs.output.querySelector('.result')
        : refs.output.querySelector(`.log[data-global-step="${currentStep}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
</html>
